apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'

apply from: rootProject.file('default-config.gradle')
apply from: rootProject.file('dependencies.gradle')

dependencies {

    implementation(
            fileTree(dir: 'libs', include: ['*.jar']),

            deps.dagger.dagger,

            deps.moshi.moshi,
            deps.logging_interceptor,
            deps.binaryprefs
    )

    api(
            deps.kotlin.stdlib,
            deps.kotlin.coroutines,
            deps.appcompat,
            deps.material,
            deps.fragment,
            deps.constraintlayout,
            deps.ktx,

            deps.navigation.fragment,
            deps.navigation.ui,

            deps.retrofit.retrofit,
            deps.retrofit.moshi_converter,

            deps.timber,
            deps.glide,

            deps.groupie.groupie,
            deps.groupie.viewbinding,

            deps.lottie,
            deps.mvicorediff,
            deps.tink
    )

    kapt(
            deps.dagger.processor,
            deps.moshi.codegen
    )

    testImplementation(testDependencies)
    androidTestImplementation(androidTestDependencies)
}

android {
    namespace 'com.example.core'
}
